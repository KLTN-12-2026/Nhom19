spring.application.name=device_maintenance_backend
spring.datasource.url=jdbc:mysql://localhost:3306/device_maintenance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/demo

app.jwt.access-token-ttl-minutes=30
# Leave empty to generate a new key at startup. Set a Base64-encoded key of at least 32 bytes to keep it stable.
app.jwt.secret-base64=

app.bootstrap.admin.username=admin
app.bootstrap.admin.email=admin@example.com
# Set a password to enable admin creation on startup. Existing accounts keep their password.
app.bootstrap.admin.password=vandiep1
